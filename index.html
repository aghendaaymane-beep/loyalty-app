<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الولاء والزيارات</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { color: #25D366; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 10px; font-weight: bold; font-size: 14px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        /* اخفاء النص بنقاط سوداء دون تفعيل ميزة الباسورد في الآيفون */
        .mask-text {
            -webkit-text-security: disc;
            letter-spacing: 3px;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #1ebe5d; }
        .lock-msg {
            color: #d9534f;
            background: #fdf7f7;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            line-height: 1.5;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        .result-box {
            display: none;
            background: #e8f5e9;
            border: 2px solid #25D366;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }
        .result-box h3 { color: #2e7d32; margin-top: 0; }
        .gift-text { color: #d9534f; font-weight: bold; font-size: 18px; margin-top: 10px; }
        #loading { display: none; color: #666; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎁 برنامج الولاء والزيارات</h2>

        <div id="lockMessage" class="lock-msg">
            ⚠️ عذراً، لا يمكن الوصول لهذه الصفحة مباشرة! يرجى مسح الـ QR Code الموجود داخل المحل.
        </div>

        <!-- تم إعطاء اسماء وهمية للفورم والخانة لتضليل نظام آيفون بالكامل -->
        <form id="loyaltyForm" style="display: none;" autocomplete="off" name="shoppro_form_xyz">
            <div class="badge">مسح ضوئي ناجح من داخل المحل ✔️</div>
            
            <label for="clientPhone">رقم الهاتف:</label>
            <input type="tel" id="clientPhone" placeholder="0612345678" required autocomplete="off">

            <label for="verificationCode">الكود السري المكتوب في المحل اليوم:</label>
            <input type="text" id="verificationCode" class="mask-text" placeholder="أدخل الكود السري" maxlength="6" required autocomplete="off" name="otp_field_9988">

            <button type="submit" id="submitBtn">تسجيل الزيارة</button>
            <div id="loading">جاري التحقق وتسجيل الزيارة... ⏳</div>
        </form>

        <div id="resultBox" class="result-box">
            <h3 id="resPhoneTitle"></h3>
            <p id="resVisitsCount"></p>
            <div id="resGift" class="gift-text"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-0KHJqaq7_MYVba7R9-nUbR--cDMCLBLqLPWkpf7oTJsmFj5TgVwdxbpfP9s7eCnDMA/exec";
        
        // 🔑 الكود السري الخاص بالمحل اليوم
        const DAILY_PIN = "2026";

        const urlParams = new URLSearchParams(window.location.search);
        const isFromQR = urlParams.get('qr') === 'true';

        const loyaltyForm = document.getElementById('loyaltyForm');
        const lockMessage = document.getElementById('lockMessage');
        const resultBox = document.getElementById('resultBox');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        if (isFromQR) {
            loyaltyForm.style.display = 'block';
            lockMessage.style.display = 'none';
        } else {
            lockMessage.style.display = 'block';
            loyaltyForm.style.display = 'none';
        }

        loyaltyForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let phone = document.getElementById('clientPhone').value.trim();
            let enteredPin = document.getElementById('verificationCode').value.trim();
            let cleanPhone = phone.replace(/[^0-9]/g, '');

            if (enteredPin !== DAILY_PIN) {
                alert("⚠️ الكود السري غير صحيح! يرجى التأكد من الكود المكتوب داخل المحل.");
                return;
            }

            if (!cleanPhone) {
                alert("المرجو إدخال رقم هاتف صحيح");
                return;
            }

            submitBtn.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ phone: cleanPhone })
                });
                let data = await res.json();

                loadingDiv.style.display = 'none';
                loyaltyForm.style.display = 'none';
                
                document.getElementById('resPhoneTitle').innerText = `رقم الهاتف: ${phone}`;
                
                let giftMsg = "";

                if (data.alreadyToday) {
                    document.getElementById('resVisitsCount').innerText = `⚠️ لقد قمت بتسجيل زيارتك اليوم بالفعل!`;
                    giftMsg = `لا يمكنك تسجيل أكثر من زيارة في نفس اليوم. ننتظرك في زيارتك القادمة للمحل غداً! 📌`;
                } else {
                    let visits = data.visits;
                    if (data.gift || visits === 5) {
                        visits = 5;
                        giftMsg = "🎉 مبروك! هذه زيارتك رقم 5، لقد ربحت معنا هدية مجانية أو خصماً خاصاً! أري هذه الشاشة لصاحب المحل.";
                    } else {
                        let remaining = 5 - visits;
                        giftMsg = `باقي لك ${remaining} زيارات وتصل للهدية الكبرى! 🎁`;
                    }
                    document.getElementById('resVisitsCount').innerText = `هذه هي زيارتك رقم: ${visits} للمحل 📌`;
                }

                document.getElementById('resGift').innerText = giftMsg;
                resultBox.style.display = 'block';

            } catch (error) {
                console.error(error);
                loadingDiv.style.display = 'none';
                loyaltyForm.style.display = 'none';
                document.getElementById('resPhoneTitle').innerText = `رقم الهاتف: ${phone}`;
                document.getElementById('resVisitsCount').innerText = `تم تسجيل زيارتك بنجاح! 📌`;
                document.getElementById('resGift').innerText = `باقي لك زيارات وتصل للهدية الكبرى! 🎁`;
                resultBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
