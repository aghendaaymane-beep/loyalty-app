<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الولاء والزيارات</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { color: #25D366; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 10px; font-weight: bold; font-size: 14px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        
        /* ستايل شاشة عرض الرمز السري بنقاط سرية */
        .pin-display {
            font-size: 24px;
            letter-spacing: 8px;
            background: #fafafa;
            color: #333;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 6px 0 12px 0;
            font-weight: bold;
        }

        /* لوحة الأرقام التفاعلية داخل الصفحة */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .key-btn {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: background 0.2s;
        }
        .key-btn:active {
            background-color: #e2e6ea;
        }
        .key-del {
            background-color: #fdf7f7;
            color: #d9534f;
            border-color: #f5c6cb;
        }

        button.submit-btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button.submit-btn:hover { background-color: #1ebe5d; }
        
        .lock-msg {
            color: #d9534f;
            background: #fdf7f7;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            line-height: 1.5;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        .result-box {
            display: none;
            background: #e8f5e9;
            border: 2px solid #25D366;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }
        .result-box h3 { color: #2e7d32; margin-top: 0; }
        .gift-text { color: #d9534f; font-weight: bold; font-size: 18px; margin-top: 10px; }
        #loading { display: none; color: #666; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎁 برنامج الولاء والزيارات</h2>

        <div id="lockMessage" class="lock-msg">
            ⚠️ عذراً، لا يمكن الوصول لهذه الصفحة مباشرة! يرجى مسح الـ QR Code الموجود داخل المحل.
        </div>

        <form id="loyaltyForm" style="display: none;">
            <div class="badge">مسح ضوئي ناجح من داخل المحل ✔️</div>
            
            <label for="clientPhone">رقم الهاتف:</label>
            <input type="tel" id="clientPhone" placeholder="0612345678" required autocomplete="off">

            <label>الرمز السري المكتوب في المحل:</label>
            <!-- شاشة عرض الرمز المكتفية بالنقاط (بدون خانة كتابة تقليدية) -->
            <div id="pinDisplay" class="pin-display">----</div>

            <!-- لوحة الأرقام التفاعلية -->
            <div class="keypad">
                <button type="button" class="key-btn" onclick="pressNum('1')">1</button>
                <button type="button" class="key-btn" onclick="pressNum('2')">2</button>
                <button type="button" class="key-btn" onclick="pressNum('3')">3</button>
                <button type="button" class="key-btn" onclick="pressNum('4')">4</button>
                <button type="button" class="key-btn" onclick="pressNum('5')">5</button>
                <button type="button" class="key-btn" onclick="pressNum('6')">6</button>
                <button type="button" class="key-btn" onclick="pressNum('7')">7</button>
                <button type="button" class="key-btn" onclick="pressNum('8')">8</button>
                <button type="button" class="key-btn" onclick="pressNum('9')">9</button>
                <button type="button" class="key-btn key-del" onclick="clearPin()">C</button>
                <button type="button" class="key-btn" onclick="pressNum('0')">0</button>
                <button type="button" class="key-btn key-del" onclick="deletePin()">⌫</button>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">تسجيل الزيارة</button>
            <div id="loading">جاري التحقق وتسجيل الزيارة... ⏳</div>
        </form>

        <div id="resultBox" class="result-box">
            <h3 id="resPhoneTitle"></h3>
            <p id="resVisitsCount"></p>
            <div id="resGift" class="gift-text"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-0KHJqaq7_MYVba7R9-nUbR--cDMCLBLqLPWkpf7oTJsmFj5TgVwdxbpfP9s7eCnDMA/exec";
        
        // 🔑 الكود السري الخاص بالمحل اليوم
        const DAILY_PIN = "2026";
        let enteredPin = "";

        // دالة الضغط على أرقام اللوحة التفاعلية
        function pressNum(num) {
            if (enteredPin.length < 6) {
                enteredPin += num;
                updateDisplay();
            }
        }

        // مسح خانة واحدة
        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDisplay();
        }

        // مسح الكل
        function clearPin() {
            enteredPin = "";
            updateDisplay();
        }

        // تحديث شكل النقاط في الشاشة
        function updateDisplay() {
            const display = document.getElementById('pinDisplay');
            if (enteredPin.length === 0) {
                display.innerText = "----";
            } else {
                display.innerText = "•".repeat(enteredPin.length);
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const isFromQR = urlParams.get('qr') === 'true';

        const loyaltyForm = document.getElementById('loyaltyForm');
        const lockMessage = document.getElementById('lockMessage');
        const resultBox = document.getElementById('resultBox');
        const loadingDiv = document.getElementById('loading');
        const submitBtn = document.getElementById('submitBtn');

        if (isFromQR) {
            loyaltyForm.style.display = 'block';
            lockMessage.style.display = 'none';
        } else {
            lockMessage.style.display = 'block';
            loyaltyForm.style.display = 'none';
        }

        loyaltyForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let phone = document.getElementById('clientPhone').value.trim();
            let cleanPhone = phone.replace(/[^0-9]/g, '');

            if (enteredPin !== DAILY_PIN) {
                alert("⚠️ الرمز السري غير صحيح! يرجى التأكد من الرمز المكتوب داخل المحل.");
                return;
            }

            if (!cleanPhone) {
                alert("المرجو إدخال رقم هاتف صحيح");
                return;
            }

            submitBtn.style.display = 'none';
            loadingDiv.style.display = 'block';

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ phone: cleanPhone })
                });
                let data = await res.json();

                loadingDiv.style.display = 'none';
                loyaltyForm.style.display = 'none';
                
                document.getElementById('resPhoneTitle').innerText = `رقم الهاتف: ${phone}`;
                
                let giftMsg = "";

                if (data.alreadyToday) {
                    document.getElementById('resVisitsCount').innerText = `⚠️ لقد قمت بتسجيل زيارتك اليوم بالفعل!`;
                    giftMsg = `لا يمكنك تسجيل أكثر من زيارة في نفس اليوم. ننتظرك في زيارتك القادمة للمحل غداً! 📌`;
                } else {
                    let visits = data.visits;
                    if (data.gift || visits === 5) {
                        visits = 5;
                        giftMsg = "🎉 مبروك! هذه زيارتك رقم 5، لقد ربحت معنا هدية مجانية أو خصماً خاصاً! أري هذه الشاشة لصاحب المحل.";
                    } else {
                        let remaining = 5 - visits;
                        giftMsg = `باقي لك ${remaining} زيارات وتصل للهدية الكبرى! 🎁`;
                    }
                    document.getElementById('resVisitsCount').innerText = `هذه هي زيارتك رقم: ${visits} للمحل 📌`;
                }

                document.getElementById('resGift').innerText = giftMsg;
                resultBox.style.display = 'block';

            } catch (error) {
                console.error(error);
                loadingDiv.style.display = 'none';
                loyaltyForm.style.display = 'none';
                document.getElementById('resPhoneTitle').innerText = `رقم الهاتف: ${phone}`;
                document.getElementById('resVisitsCount').innerText = `تم تسجيل زيارتك بنجاح! 📌`;
                document.getElementById('resGift').innerText = `باقي لك زيارات وتصل للهدية الكبرى! 🎁`;
                resultBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
