<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الولاء والزيارات</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 { color: #25D366; margin-top: 0; }
        label { display: block; text-align: right; margin-top: 10px; font-weight: bold; font-size: 14px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #1ebe5d; }
        .lock-msg {
            color: #d9534f;
            background: #fdf7f7;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            line-height: 1.5;
        }
        .badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎁 برنامج الولاء</h2>

        <!-- رسالة المنع -->
        <div id="lockMessage" class="lock-msg">
            ⚠️ يرجى مسح الـ QR Code الموجود داخل المحل لتسجيل زيارتك والاستفادة من العروض!
        </div>

        <!-- الاستمارة -->
        <form id="loyaltyForm" style="display: none;">
            <div class="badge">مسح ضوئي ناجح من داخل المحل ✔️</div>
            
            <label for="clientName">الاسم الكامل:</label>
            <input type="text" id="clientName" placeholder="أدخل اسمك" required>

            <label for="clientPhone">رقم الهاتف:</label>
            <input type="tel" id="clientPhone" placeholder="0612345678" required>

            <button type="submit">تأكيد التسجيل وإرسال للواتساب</button>
        </form>
    </div>

    <script>
        // رقم واتساب المحل (عوضه برقمك الحقيقي)
        const SHOP_WHATSAPP = "212600000000"; 

        // التحقق من وجود ?qr=true في الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const isFromQR = urlParams.get('qr') === 'true';

        const loyaltyForm = document.getElementById('loyaltyForm');
        const lockMessage = document.getElementById('lockMessage');

        if (isFromQR) {
            loyaltyForm.style.display = 'block';
            lockMessage.style.display = 'none';
        } else {
            lockMessage.style.display = 'block';
            loyaltyForm.style.display = 'none';
        }

        // معالجة البيانات عند التسجيل
        loyaltyForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            let cleanPhone = phone.replace(/[^0-9]/g, '');

            let storageKey = 'visits_' + cleanPhone;
            let currentVisits = parseInt(localStorage.getItem(storageKey) || '0');
            currentVisits += 1;
            localStorage.setItem(storageKey, currentVisits);

            let message = "";
            if (currentVisits === 1) {
                message = `مرحباً! أنا ${name} (رقم الهاتف: ${phone}). هذه زيارتي الأولى وتسجيلي في برنامج الولاء.`;
            } else if (currentVisits === 5) {
                message = `مرحباً! أنا ${name} (رقم الهاتف: ${phone}). هذه زيارتي رقم 5! أود الاستفادة من الخصم أو الهدية.`;
            } else {
                message = `مرحباً! أنا ${name} (رقم الهاتف: ${phone}). هذه هي زيارتي رقم ${currentVisits} للمحل.`;
            }

            let whatsappUrl = `https://wa.me/${SHOP_WHATSAPP}?text=${encodeURIComponent(message)}`;
            window.location.href = whatsappUrl;
        });
    </script>

</body>
</html>
